
map $uri $portfolio_cache_control {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /srv/portfolio;
    index index.html;

    add_header Cache-Control $portfolio_cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
